name: Academy preview source checks
on:
  pull_request:
    branches: [main]
  push:
    branches:
      - "feature/v6-beginner-academy-20261012"
permissions:
  contents: read
jobs:
  integrity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Check Node runtime
        run: node --version
      - name: Run bounded Node tests
        run: node --test tests/academy-v6-contract.test.mjs tests/model-desk-v6-contract.test.mjs
      - name: Install dependencies with repository preflight
        run: npm run install:ci
      - name: Build Atlas using the existing verified build script
        run: npm run build
      - name: Lint source with existing repository config
        run: npm run lint

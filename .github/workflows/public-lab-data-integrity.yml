name: Atlas public-lab data integrity
on:
  pull_request:
    paths:
      - "lib/v5-state.ts"
      - "tests/public-lab-data-integrity.test.mjs"
      - ".github/workflows/public-lab-data-integrity.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  public-lab-regressions:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"
          cache: npm
      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund
      - name: Check Atlas public-lab state integrity
        run: node --test tests/public-lab-data-integrity.test.mjs
